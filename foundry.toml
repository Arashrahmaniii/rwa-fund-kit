[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512
# Fixed so every run, and the mutation check, is reproducible. Change it to explore other paths.
seed = "0x52574131"

[invariant]
runs = 128
depth = 150
fail_on_revert = false

[fmt]
line_length = 110
tab_width = 4

[lint]
lint_on_build = false
